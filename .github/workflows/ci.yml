name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU build first: the suite runs on CPU, and the default wheel pulls
          # several GB of CUDA libraries.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,analysis]"

      - name: Lint
        run: ruff check src/ tests/core tests/conftest.py tests/utils.py

      - name: Test
        # The suite runs on CPU and needs no checkpoints or external data.
        run: pytest tests -q
