# End-to-end analysis manifest for analysis/run_pipeline.py
#
# Usage (copy this template, fill in the paths, then run from the repository root):
#   python analysis/run_pipeline.py --config /path/to/my_analysis.yml
#
# This template holds the settings of the paper (arXiv:2605.09949) for the 500-step
# checkpoint series. The 5,000-step series to 700k steps (Fig 2, S3b, S6,
# S8, Table 2) is run with a second manifest; see analysis/README.md, "Reproducing the paper".

version: 1
output_root: /path/to/analysis-run

# Settings shared by all models and copied only to scripts that consume them.
# eval_data: valid_10k.csv (5 x 2,000 rows: ZINC (~100), PubChem (~100), (101~200),
# (201~300), (301~400)); used by 01, 02, 06 and 07.
shared:
  tokenizer_path: /path/to/vocab/normal_tokens.txt
  eval_data: /path/to/valid_10k.csv
  src_col: random
  tgt_col: canonical
  seed: 42

models:
  - name: your_model
    display_name: Your model
    color: tab:blue
    checkpoint_dir: /path/to/your_model/checkpoints_500step
    # Checkpoint used as "final" by analysis 07 (paper: checkpoint-700000 of the 5,000-step
    # series). Omit to use the last checkpoint of checkpoint_dir.
    final_checkpoint: /path/to/your_model/checkpoints_5000step/checkpoint-700000
    # Leave null for the first run, then fill from visualization 12
    # (figures/12/{model}/attention_mass_enc_head_ranking.csv) and run the same command again.
    # chiral_heads: top heads by interval_amplitude (used at before_jump, jump_peak, after_jump).
    # final_chiral_heads: top heads by last_step_mass in the ranking of the run whose last
    # checkpoint is final_checkpoint (paper: the 5,000-step manifest, step 700,000).
    # Paper: addonce [[6,1],[6,7],[7,5]] / same; xattn-adalnzero [[6,5],[7,1],[7,4]] /
    # [[7,1],[5,7],[7,0]]; baseline [[7,0],[7,2],[7,7]] / [[7,7],[7,0],[1,0]].
    chiral_heads: null
    final_chiral_heads: null

# Analysis 09 requires an evaluation CSV with its additional probe-label columns.
mutual_information:
  eval_data: /path/to/single_chiral_rs_probe.csv
  src_col: random
  rs_label_col: rs_label_id
  canonical_token_label_col: canonical_chiral_token_id
  probe_layers: [0, 2, 5, 7]

# Analysis 03's perplexity trajectory is the sole jump-detection source.
jump_detection:
  source: perplexity
  threshold_ratio: 0.15
  ignore_initial_n: 10

# 02 (full decodes) and 08 (weight matrices) are not needed for the 500-step paper figures.
analyses:
  enabled: [1, 3, 4, 5, 6, 7, 9]
  visualize: [11, 12, 13, 14, 16]

# Optional global per-analysis overrides. Model entries may also define an
# analysis_options mapping with the same structure.
analysis_options:
  "01":
    batch_size: 3584
    max_length: 402
    use_bf16: true
    teacher_forced_token_accuracy: true   # Fig 3 (teacher-forced, fp32)
    teacher_forced_batch_size: 500
  "02":
    batch_size: 3584
    max_length: 402
    use_bf16: true
  "03":
    # Paper: ZINC20 rows (phase 1 of 5) of the 1,000-row sample.
    eval_data: /path/to/sampled_valid_1k_seed_42.csv
    phase: 1
    max_phase: 5
    batch_size: 128
    max_len: 402
    compute_graph_metrics: true
  "04":
    # Paper: canonical SMILES as encoder input, ZINC20 rows (phase 1 of 5) of valid_10k.csv.
    src_col: canonical
    phase: 1
    max_phase: 5
    batch_size: 256
    max_len: 512
  "05":
    # Paper: same subset as analysis 03.
    eval_data: /path/to/sampled_valid_1k_seed_42.csv
    phase: 1
    max_phase: 5
    batch_size: 128
    max_len: 402
  "06":
    # Paper: fp32 encoding and decoding.
    batch_size: 1024
    max_length: 402
    use_bf16: false
  "07":
    batch_size: 2048
    max_length: 402
    # true reproduces the head set ablated for Table 4 / S5 "all chiral heads" in arXiv v1
    # (see the docstring of 07_head_ablation.py); false ablates exactly chiral_heads.
    legacy_all_heads_union: false
  "09":
    batch_size: 512
    max_len: 512
    n_splits: 5
    min_samples: 50
    n_probe_shuffle: 5
    enable_nonlinear_probe: true
    enable_canonical_token_probe: true
    # Input @/@@ control probe (paper Section C). The paper value was computed on valid_10k.csv
    # random SMILES with probe_layers 0-7; here it runs on mutual_information.eval_data.
    enable_token_identity_probe: false

visualization_options:
  "12":
    encoder_only: false
    top_n_heads: 3
  # Axis limits of the paper figures (pancore-addonce panels; global for all models).
  "13":
    cos_ylim: [0.99, 1.0]     # Fig 6c,d and S7c,d
  "14":
    ylim: {cosine: [0.999, 1.0], cka: [0.9975, 1.0]}   # Fig 7b,c
  "16":
    figsize: [14, 5]
