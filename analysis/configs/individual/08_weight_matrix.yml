# Config for 08_weight_matrix.py
# Usage: python analysis/scripts/compute/08_weight_matrix.py --config analysis/configs/individual/08_weight_matrix.yml
#
# Tracks weight matrix statistics (L2 norm, cosine similarity, CKA) across training.
# Supplementary analysis; not used in the paper. Does NOT require a GPU.

# ── Required ──────────────────────────────────────────────────────────────────
model_name: your_model
checkpoint_dir: /path/to/your_model/checkpoints
output_dir: /path/to/results/weight_matrix

# ── Optional (defaults shown) ─────────────────────────────────────────────────
seed: 42

# Subset of training steps; null = all checkpoints in checkpoint_dir.
checkpoint_steps: ~
